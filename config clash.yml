{
    "mixed-port": 7890,
    "ipv6": true,
    "allow-lan": true,
    "mode": "rule",
    "log-level": "warning",
    "disable-keep-alive": false,
    "keep-alive-idle": 10,
    "keep-alive-interval": 15,
    "unified-delay": false,
    "geo-auto-update": true,
    "geo-update-interval": 168,
    "external-controller": "127.0.0.1:9090",
    "external-ui-url": "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip",
    "external-ui": "ui",
    "external-controller-cors": {
        "allow-origins": [
            "*"
        ],
        "allow-private-network": true
    },
    "profile": {
        "store-selected": true,
        "store-fake-ip": true
    },
    "dns": {
        "enable": true,
        "listen": "0.0.0.0:1053",
        "ipv6": false,
        "respect-rules": true,
        "use-system-hosts": true,
        "nameserver": [
            "https://172.20.10.1/dns-query#✅ Selector"
        ],
        "proxy-server-nameserver": [
            "172.20.10.1#DIRECT"
        ],
        "nameserver-policy": {
            "raw.githubusercontent.com": "172.20.10.1#DIRECT",
            "time.apple.com": "172.20.10.1#DIRECT"
        },
        "hosts": {
            "rule-set:malware": "127.0.0.1",
            "rule-set:phishing": "127.0.0.1",
            "rule-set:cryptominers": "127.0.0.1"
        },
        "enhanced-mode": "fake-ip",
        "fake-ip-range": "198.18.0.1/16",
        "fake-ip-filter": [
            "*",
            "+.lan",
            "+.local"
        ]
    },
    "tun": {
        "enable": true,
        "stack": "mixed",
        "auto-route": true,
        "strict-route": true,
        "auto-detect-interface": true,
        "dns-hijack": [
            "any:53",
            "tcp://any:53"
        ],
        "mtu": 1136
    },
    "sniffer": {
        "enable": true,
        "force-dns-mapping": true,
        "parse-pure-ip": true,
        "override-destination": true,
        "sniff": {
            "HTTP": {
                "ports": [
                    80,
                    8080,
                    8880,
                    2052,
                    2082,
                    2086,
                    2095
                ]
            },
            "TLS": {
                "ports": [
                    443,
                    8443,
                    2053,
                    2083,
                    2087,
                    2096
                ]
            }
        }
    },
